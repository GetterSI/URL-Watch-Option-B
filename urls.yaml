# urls.yaml — urlwatch jobs for the Source Intelligence regulatory watchlist.
#
# Built 2026-09-17 from "Visual Ping Sources.xlsx" (export dated 2026-08-11,
# user consultancy@sourceintel.com) — ALL 218 sources.
#
# The earlier monitors watched 213. Five sources had been dropped in an earlier
# normalisation and were never checked by anything:
#   2913455  Fost Plus — What does it cost?        (Belgian packaging fees)
#   6514863  Recycle BC — Reporting & Fees
#   6840788  Procircular news and webinars
#   7280329  Türkiye RoHS gazette
#   7937745  Netherlands Textiles EPR Regulation
# They are included here.
#
# Job names begin with the Visualping ID so any alert traces straight back to
# the export; tags carry vp-<id> for filtering.
#
# Global settings — user agent, filters, retries — live in urlwatch.yaml under
# job_defaults, not repeated 218 times here.
#
# BROWSER JOBS use Playwright only where there is MEASURED evidence a plain
# fetch is not enough: CIRCABC (Angular app), ECHA (Azure WAF interstitial),
# std.iec.ch (content inside a frame). Each waits for a selector that exists
# only once real content has rendered — NOT for "networkidle", which
# urlwatch’s own docs call discouraged and which caused an earlier attempt to
# store WAF challenge pages as though they were content. If a challenge is
# still up the selector never appears and the job FAILS VISIBLY. A visible
# failure is recoverable; a plausible fake is not.
#
# Selectors end ">> nth=0" because Playwright locators are strict: a selector
# matching several elements raises "strict mode violation".
#
# DEDUPE: urlwatch refuses to start if two jobs share a location and documents
# the remedy itself — append #1, #2. Three URLs appear twice in the export; the
# second of each carries #2. Fragments are never sent to a server.

